<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kareena | Cloud Assessment 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 60px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.5em;
            color: #2d3748;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 35px;
        }
        .pipeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .step {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
        }
        .arrow { color: #667eea; font-size: 20px; font-weight: bold; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }
        .stat {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            padding: 20px 10px;
            color: white;
        }
        .stat-number { font-size: 2em; font-weight: 700; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        .footer {
            color: #a0aec0;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        .live { color: #48bb78; font-weight: 700; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🚀 LIVE ON AWS</div>
        <h1>Cloud Deployment</h1>
        <p class="subtitle">Automated CI/CD Pipeline — ACU Assessment 2026</p>

        <div class="pipeline">
            <div class="step">📝 GitHub Push</div>
            <div class="arrow">→</div>
            <div class="step">⚙️ GitHub Actions</div>
            <div class="arrow">→</div>
            <div class="step">🏗️ Terraform</div>
            <div class="arrow">→</div>
            <div class="step">☁️ AWS S3</div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-number">4</div>
                <div class="stat-label">Files Deployed</div>
            </div>
            <div class="stat">
                <div class="stat-number">~20s</div>
                <div class="stat-label">Deploy Time</div>
            </div>
            <div class="stat">
                <div class="stat-number">100%</div>
                <div class="stat-label">Automated</div>
            </div>
        </div>

        <div class="footer">
            Built by <strong>Kareena</strong> | Student ID: KAREENA618<br>
            Status: <span class="live">● LIVE</span> | Hosted on AWS S3 | Provisioned with Terraform
        </div>
    </div>
</body>
</html>
