<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Kareena Antonio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            width: 380px;
            color: white;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 15px;
            outline: none;
        }
        .search input::placeholder { color: rgba(255,255,255,0.6); }
        .search button {
            padding: 12px 20px;
            border-radius: 50px;
            border: none;
            background: #e94560;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .weather-icon { font-size: 80px; text-align: center; margin: 10px 0; }
        .temp { font-size: 64px; font-weight: 700; text-align: center; }
        .city { font-size: 24px; text-align: center; opacity: 0.9; margin-bottom: 5px; }
        .desc { text-align: center; opacity: 0.7; margin-bottom: 25px; font-size: 16px; }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .detail {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        .detail-val { font-size: 22px; font-weight: 700; }
        .detail-label { font-size: 12px; opacity: 0.7; margin-top: 4px; }
        .footer { text-align: center; margin-top: 25px; font-size: 11px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="app">
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city..." value="Sydney"/>
            <button onclick="getWeather()">🔍</button>
        </div>
        <div id="weatherDisplay">
            <div class="weather-icon">🌤️</div>
            <div class="temp">22°C</div>
            <div class="city">Sydney</div>
            <div class="desc">Partly Cloudy</div>
            <div class="details">
                <div class="detail">
                    <div class="detail-val">65%</div>
                    <div class="detail-label">Humidity</div>
                </div>
                <div class="detail">
                    <div class="detail-val">14 km/h</div>
                    <div class="detail-label">Wind Speed</div>
                </div>
                <div class="detail">
                    <div class="detail-val">1013 hPa</div>
                    <div class="detail-label">Pressure</div>
                </div>
                <div class="detail">
                    <div class="detail-val">18°C</div>
                    <div class="detail-label">Feels Like</div>
                </div>
            </div>
        </div>
        <div class="footer">Deployed via Terraform + GitHub Actions + AWS S3</div>
    </div>

    <script>
        const weatherData = {
            sydney: { icon: '🌤️', temp: 22, desc: 'Partly Cloudy', humidity: 65, wind: 14, pressure: 1013, feels: 18 },
            london: { icon: '🌧️', temp: 12, desc: 'Rainy', humidity: 82, wind: 20, pressure: 1008, feels: 9 },
            tokyo: { icon: '⛅', temp: 18, desc: 'Overcast', humidity: 70, wind: 10, pressure: 1015, feels: 16 },
            paris: { icon: '🌥️', temp: 15, desc: 'Cloudy', humidity: 75, wind: 16, pressure: 1011, feels: 13 },
            dubai: { icon: '☀️', temp: 38, desc: 'Sunny', humidity: 40, wind: 8, pressure: 1005, feels: 42 },
            newyork: { icon: '🌦️', temp: 20, desc: 'Light Rain', humidity: 72, wind: 18, pressure: 1010, feels: 17 },
        };

        function getWeather() {
            const city = document.getElementById('cityInput').value.toLowerCase().replace(/\s/g, '');
            const data = weatherData[city] || { icon: '🌍', temp: '??', desc: 'City not found — try Sydney, London, Tokyo, Paris, Dubai, New York', humidity: '--', wind: '--', pressure: '--', feels: '--' };
            document.getElementById('weatherDisplay').innerHTML = `
                <div class="weather-icon">${data.icon}</div>
                <div class="temp">${data.temp}${data.temp !== '??' ? '°C' : ''}</div>
                <div class="city">${document.getElementById('cityInput').value}</div>
                <div class="desc">${data.desc}</div>
                <div class="details">
                    <div class="detail"><div class="detail-val">${data.humidity}${data.humidity !== '--' ? '%' : ''}</div><div class="detail-label">Humidity</div></div>
                    <div class="detail"><div class="detail-val">${data.wind}${data.wind !== '--' ? ' km/h' : ''}</div><div class="detail-label">Wind Speed</div></div>
                    <div class="detail"><div class="detail-val">${data.pressure}${data.pressure !== '--' ? ' hPa' : ''}</div><div class="detail-label">Pressure</div></div>
                    <div class="detail"><div class="detail-val">${data.feels}${data.feels !== '--' ? '°C' : ''}</div><div class="detail-label">Feels Like</div></div>
                </div>`;
        }
    </script>
</body>
</html>
